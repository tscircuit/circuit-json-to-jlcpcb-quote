<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JLCPCB Quote</title>
    <meta
      name="description"
      content="Estimate what JLCPCB will charge for a board from its fabrication files or Circuit JSON."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>JLCPCB Quote</h1>
        <p class="muted">
          Fabrication, additional fees, Economic and Standard PCBA, shipping and
          taxes, estimated in your browser. Parts are priced from
          <a href="https://jlcsearch.tscircuit.com">jlcsearch</a>.
        </p>
      </header>

      <label id="drop-zone" class="drop-zone" for="file-input">
        <strong>Drop files here</strong>
        <span>
          a fabrication zip, Gerber and drill files with bom.csv and
          pick_and_place.csv, or a Circuit JSON file
        </span>
        <span class="browse">or click to choose files</span>
        <input
          id="file-input"
          type="file"
          multiple
          accept=".zip,.json,.gbr,.drl,.xln,.csv,.gtl,.gbl,.gto,.gbo,.gts,.gbs,.gtp,.gbp,.gko,.gm1"
        />
      </label>

      <form id="order-form" class="order-form">
        <label>PCB quantity <input name="quantity" type="number" min="1" value="5" /></label>
        <label>Assembled boards <input name="assembledQuantity" type="number" min="1" value="2" /></label>
        <label>Assembly
          <select name="assembly">
            <option value="auto">Auto</option>
            <option value="economic">Economic</option>
            <option value="standard">Standard</option>
            <option value="none">None</option>
          </select>
        </label>
        <label>Surface finish
          <select name="surfaceFinish">
            <option value="hasl_lead_free" selected>Lead-free HASL</option>
            <option value="hasl_leaded">HASL (with lead)</option>
            <option value="enig">ENIG</option>
          </select>
        </label>
        <label>Material
          <select name="material">
            <option value="">From the files</option>
            <option value="fr4">FR4</option>
            <option value="flex">Flex</option>
          </select>
        </label>
        <label>Thickness (mm) <input name="thicknessMm" type="number" step="0.01" min="0" placeholder="from the files" /></label>
        <label>Carrier
          <select name="carrier">
            <option value="dhl">DHL Express</option>
            <option value="ups">UPS Express Saver</option>
          </select>
        </label>
        <label>Shipping cost (USD) <input name="shippingCost" type="number" step="0.01" min="0" placeholder="estimate" /></label>
        <label>Order weight (kg) <input name="shippingWeightKg" type="number" step="0.001" min="0" placeholder="estimate" /></label>
        <label class="checkbox">
          <input name="excludeUnresolved" type="checkbox" checked />
          Quote without parts that cannot be priced
        </label>
      </form>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
